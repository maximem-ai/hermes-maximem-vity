name: maximem_vity
version: 1.4.0
manifest_version: 1
description: "Vity by Maximem AI: cross-session semantic memory with profile-based recall, memory graph, and low-latency context injection."

# Installed automatically by `hermes memory setup vity` (uv pip install).
# 0.3.1+ is required: the plugin uses the Profile Card (0.3.1) and the knowledge
# query, meeting recall, capture-status, single-memory edit/delete and search
# relevance-floor APIs (0.3.0).
pip_dependencies:
  - maximem-vity-sdk>=0.3.1,<1

# Prompted for during `hermes plugins install` (saved to ~/.hermes/.env).
requires_env:
  - name: MAXIMEM_API_KEY
    description: "Maximem API key (starts with mx_)"
    url: "https://app.maximem.ai/api-keys"
    secret: true
